<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CB Entrevías · Partido en directo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#04080b;--panel:#0b151a;--line:#1b3944;--club:#3a9bb5;--text:#f4fbff;--mute:#7fa3af;--warn:#ffb020;--bad:#ff4d5e;--riv:#e5484d;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.4 Barlow,system-ui,sans-serif;max-width:560px;margin-inline:auto;padding:10px 12px 40px}
h1,h2,.num,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:linear-gradient(180deg,#0f2a33,var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px}
.team{text-align:center}.team .name{font:700 15px "Barlow Condensed",sans-serif;color:var(--mute);display:flex;gap:6px;align-items:center;justify-content:center}
.team .big{font-size:64px;font-weight:800;line-height:1}
.club .big{color:#fff;text-shadow:0 0 24px var(--club)}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:10px}.hd img{width:64px;height:64px}.hd h1{font-size:30px;font-weight:800;line-height:1}.hd p{margin:2px 0 0;color:var(--mute);font-size:13px}
body::before{content:"";position:fixed;inset:0;background:var(--logo) center 58%/min(100vw,600px) no-repeat;opacity:.12;pointer-events:none;z-index:-1}
.mid{text-align:center}.mid .q{font:700 16px "Barlow Condensed",sans-serif;color:var(--mute)}
.mid .clock{font:800 40px "Barlow Condensed",sans-serif;letter-spacing:1px}
.ctl{display:flex;gap:6px;justify-content:center;margin-top:4px}
.ctl button{background:var(--line);padding:7px 12px;border-radius:8px;font-weight:600}
.ctl .go{background:var(--club);color:#031116}
.fouls{font-size:13px;color:var(--mute)}.fouls b{color:var(--text)}.bonus{color:var(--warn);font-weight:700}
.sw{display:inline-flex;gap:5px;margin-top:6px}.sw i{width:18px;height:18px;border-radius:50%;border:2px solid transparent;display:block;cursor:pointer}.sw i.on{border-color:#fff}
.alert{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn);color:#1a1200;font-weight:700;display:none}
.alert.out{background:var(--bad);color:#fff}.alert.show{display:block}
.court{position:relative;margin-top:10px;aspect-ratio:100/92;border-radius:14px;background:#071014;border:1px solid var(--line);overflow:hidden}
.court svg{position:absolute;inset:0;width:100%;height:100%}
.tok{position:absolute;transform:translate(-50%,-50%);width:74px;text-align:center;background:none;padding:0}
.tok .c{width:56px;height:56px;margin:auto;border-radius:50%;background:var(--club);display:grid;place-items:center;color:#031116;font:800 26px "Barlow Condensed",sans-serif;border:3px solid #071014;box-shadow:0 0 0 2px var(--club)}
.tok.sel .c{box-shadow:0 0 0 4px #fff}.tok.f4 .c{box-shadow:0 0 0 3px var(--warn)}.tok.sel.f4 .c{box-shadow:0 0 0 4px #fff}
.tok .n{display:block;font-size:12px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok .pf{font-size:11px;color:var(--warn)}
.tok.empty .c{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--mute)}
.panel{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.panel h2{font-size:20px;margin-bottom:8px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts button{background:#12303a;min-height:54px;border-radius:10px;font:700 20px "Barlow Condensed",sans-serif}
.acts .pt{background:var(--club);color:#031116}.acts .bad{background:#2a1a22}.acts .out{background:#4a2230}
.line{display:flex;gap:12px;color:var(--mute);font-size:13px;margin-bottom:8px;flex-wrap:wrap}.line b{color:var(--text);font-size:15px}
.bench{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bench button{background:#0f232b;border-radius:10px;padding:6px 2px;font-size:12px;min-height:58px}
.bench .num{display:block;font-size:22px;font-weight:800}
.bench button.off{opacity:.35}
.riv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.riv button{background:#12303a;min-height:50px;border-radius:10px;font:700 20px "Barlow Condensed",sans-serif}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{background:var(--line);padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:380px}
th,td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}td:nth-child(2),th:nth-child(2){text-align:left}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}.tabs button{background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:10px;font:700 18px "Barlow Condensed",sans-serif;color:var(--mute)}.tabs button.on{background:var(--club);color:#031116;border-color:var(--club)}
label{display:block;margin-bottom:12px;color:var(--mute);font-size:13px}label input{display:block;width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#071014;color:var(--text);font:inherit;font-size:16px}
.save{width:100%;background:var(--club);color:#031116;padding:14px;border-radius:10px;font:800 20px "Barlow Condensed",sans-serif}.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.m{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.m.past{opacity:.45}.m b{font:700 22px "Barlow Condensed",sans-serif}.m small{display:block;color:var(--mute);text-transform:capitalize}.empty{color:var(--mute)}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px}#gate[hidden]{display:none}
#gate .box{max-width:520px;margin:0 auto}#gate img{width:96px;height:96px;display:block;margin:0 auto 6px}#gate h1{text-align:center;font-size:30px;font-weight:800}#gate .sub{text-align:center;color:var(--mute);margin:2px 0 14px}
label select{display:block;width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#071014;color:var(--text);font:inherit;font-size:16px}
.av{display:inline-block;width:22px;height:22px;border-radius:50%;background:#12303a center/cover;vertical-align:middle;margin-right:6px}
.tabs{grid-template-columns:repeat(3,1fr)}.tok{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;max-width:420px;max-height:80vh;overflow:auto}.modal h2{font-size:22px;margin-bottom:6px}.modal button{width:100%;margin-top:6px;padding:13px;border-radius:10px;background:#12303a;text-align:left;font-weight:600}
.tabs{grid-template-columns:repeat(4,1fr)}.tabs button{font-size:14px;padding:10px 2px}
.pf{width:120px;height:120px;border-radius:50%;background:#12303a center/cover;margin:0 auto 8px;display:grid;place-items:center;font:800 40px "Barlow Condensed",sans-serif;color:var(--mute)}.pf.s{width:46px;height:46px;margin:0;font-size:20px;flex:none}
.pl{display:flex;gap:10px;align-items:center;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;text-align:left}.pl small{display:block;color:var(--mute)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.kv span:first-child{color:var(--mute)}
#app.ro .acts,#app.ro .bench,#app.ro .riv,#app.ro .ctl,#app.ro .tok,#app.ro .sw,#app.ro .mini{pointer-events:none}
.abtn{background:var(--club);color:#031116;padding:8px 12px;border-radius:8px;font-weight:700;margin-left:6px}
.hm{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hm button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 8px;min-height:104px;font:800 22px "Barlow Condensed",sans-serif;text-align:center;line-height:1.1}.hm small{display:block;font:400 13px Barlow,sans-serif;color:var(--mute);margin-top:6px}.hm button.off{opacity:.5}
.rk{margin-left:auto;font:800 26px "Barlow Condensed",sans-serif;color:var(--club)}.pos{font:800 20px "Barlow Condensed",sans-serif;width:24px;color:var(--mute);flex:none}
body{background:radial-gradient(130% 50% at 50% -5%,#134c5e 0,#071a21 48%,var(--bg) 78%) no-repeat;min-height:100vh}
.hd{border-bottom:2px solid var(--club);padding-bottom:8px}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#3a9bb5,#1b6a82);border-radius:16px;padding:14px;margin-bottom:12px;color:#fff;box-shadow:0 6px 24px rgba(58,155,181,.25)}.hero img{width:72px;height:72px;flex:none;background:#04080b;border-radius:14px;padding:4px}.hero h2{font-size:28px}.hero p{margin:3px 0 0;font-size:14px}
.hm button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0}.hm .wide{grid-column:1/-1;min-height:120px;flex-direction:row;gap:14px}
.hm .t1{background:linear-gradient(135deg,#3a9bb5,#1f7a94);color:#fff}.hm .t2{background:#f4fbff;color:#04141a}.hm .t2 svg{stroke:#1f7a94}.hm .t3{background:#0b1f27;color:#7fd3e8;border:2px solid #3a9bb5}
.hm svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.hm small{color:inherit;opacity:.85}
@keyframes gl{0%,100%{box-shadow:0 0 0 0 rgba(111,208,230,.55)}50%{box-shadow:0 0 0 10px rgba(111,208,230,0)}}.hm .glow{animation:gl 2s infinite}@media (prefers-reduced-motion:reduce){.hm .glow{animation:none}}
.panel{background:rgba(11,21,26,.78)}
#auth{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px}#auth[hidden]{display:none}#auth .box{max-width:520px;margin:0 auto}#auth img{width:96px;height:96px;display:block;margin:0 auto 6px}#auth h1{text-align:center;font-size:30px;font-weight:800}#auth .sub{text-align:center;color:var(--mute);margin:2px 0 14px}
</style>

<body>
<div class="hd"><img id="hl" alt="Escudo del CB Entrevías"><div><h1>CB ENTREVÍAS</h1><p>Partido en directo</p></div><button id="me" class="mini" style="margin-left:auto" onclick="editMe()">Mi perfil</button></div>
<div id="bk" hidden style="margin-bottom:10px"><button class="mini" onclick="tab('home')">‹ Menú</button></div>
<div id="auth" hidden><div class="box"><img id="a-logo" alt="Escudo del CB Entrevías"><h1>CB Entrevías</h1><p class="sub">Entra con tu usuario y tu clave.</p><div class="panel"><label>Usuario<input id="a-u" autocapitalize="none" autocomplete="username"></label><label>Clave<input id="a-p" type="password" autocomplete="current-password"></label><button class="save" onclick="doLogin()">Entrar</button><div class="err" id="a-e"></div><button class="mini" onclick="showGate(null)" style="margin-top:8px">Soy nuevo: registrarme</button></div></div></div>
<div id="gate"><div class="box"><img id="g-logo" alt="Escudo del CB Entrevías"><h1 id="g-t">Bienvenido</h1><p class="sub" id="g-s">Introduce el código del equipo y crea tu perfil.</p>
<div class="panel"><label id="g-uw">Usuario (letras, números, punto o guion)<input id="g-u" autocapitalize="none" autocomplete="username"></label><label id="g-pw-w">Clave (mínimo 6 caracteres)<input id="g-pw" type="password" autocomplete="new-password"></label><label id="g-cw">Código del equipo<input id="g-code" type="password" autocomplete="off"></label>
<label>Nombre<input id="g-name" maxlength="40"></label><label>Dorsal<input id="g-num" type="number" min="0" max="99" inputmode="numeric"></label>
<label>Posición preferida<select id="g-pos"><option>Base</option><option>Escolta</option><option>Alero</option><option>Ala-pívot</option><option>Pívot</option></select></label>
<label>Altura (cm)<input id="g-h" type="number" inputmode="numeric"></label>
<label>Fecha de nacimiento<input id="g-b" type="date"></label><label>Mote<input id="g-nick" maxlength="30"></label>
<label>Foto<input id="g-photo" type="file" accept="image/*"></label>
<label id="g-npw-w" hidden>Nueva clave (vacío = no cambiarla)<input id="g-npw" type="password" autocomplete="new-password"></label><button class="save" id="g-go" onclick="saveMe()">Entrar</button><div class="err" id="g-e"></div><button class="mini" id="g-x" hidden onclick="closeGate()" style="margin-top:8px">Cancelar</button> <button class="mini" id="g-out" hidden onclick="logout()" style="margin-top:8px">Cerrar sesión</button><button class="mini" id="g-login" onclick="showAuth()" style="margin-top:8px">Ya tengo usuario: entrar</button></div></div></div>
<div id="app"></div><div id="cal" hidden></div><div id="conv" hidden></div><div id="pl" hidden></div><div id="mvp" hidden></div><div id="fan" hidden></div><div id="adm" hidden></div><div id="home" hidden></div>

async function felic(){try{var r=await SB.from("match_results").select("match_id,closed_at").order("closed_at",{ascending:false}),lm=null;(r.data||[]).forEach(function(x){if(!lm&&Date.parse(x.closed_at)+1728e5<Date.now())lm=x});if(!lm)return;var key="cbe-fel-"+lm.match_id;if(localStorage.getItem(key))return;localStorage.setItem(key,"1");
var a=await SB.from("player_match_points").select("player_id,stat_pts,vote_pts"),b=await SB.from("manager_match_points").select("manager_id,pts"),lead=function(rows,k,f){var T={},mx=-1;(rows||[]).forEach(function(x){T[x[k]]=(T[x[k]]||0)+f(x)});Object.keys(T).forEach(function(u){if(T[u]>mx)mx=T[u]});return mx>0&&T[UID]===mx};
var msg=[];if(lead(a.data,"player_id",function(x){return x.stat_pts+x.vote_pts}))msg.push("Vas el primero en el ranking MVP de la temporada.");if(lead(b.data,"manager_id",function(x){return x.pts}))msg.push("Vas el primero en el Fantasy CBE.");if(!msg.length)return;

function un(u){return String(u||"").trim().toLowerCase().replace(/[^a-z0-9._-]/g,"")}
function em(u){return un(u)+"@cbentrevias.app"}
function okUser(u){return un(u).length>=3}
function showAuth(){G("gate").hidden=true;G("auth").hidden=false;G("a-logo").src=document.querySelector(".hd img").src}
async function doLogin(){var u=G("a-u").value,p=G("a-p").value,e=G("a-e");if(!okUser(u)||!p){e.textContent="Escribe tu usuario y tu clave.";return}e.textContent="Entrando…";var r=await SB.auth.signInWithPassword({email:em(u),password:p});if(r.error){e.textContent="Usuario o clave incorrectos.";return}UID=r.data.user.id;G("auth").hidden=true;e.textContent="";try{await loadMe()}catch(x){showGate(null)}}
async function logout(){await SB.auth.signOut();location.reload()}
async function regAuth(){var ss=(await SB.auth.getSession()).data.session;if(ss&&!ss.user.is_anonymous){UID=ss.user.id;return}
var u=G("g-u").value,pw=G("g-pw").value;if(!okUser(u))throw new Error("Elige un usuario de al menos 3 letras o números.");if(pw.length<6)throw new Error("La clave debe tener al menos 6 caracteres.");
if(!ss){var an=await SB.auth.signInAnonymously();if(an.error)throw an.error}
var lk=await SB.rpc("link_credentials",{p_user:un(u),p_pass:pw});if(lk.error)throw new Error(/ya existe/i.test(lk.error.message)?"Ese usuario ya existe. Elige otro o entra con él.":lk.error.message);
var si=await SB.auth.signInWithPassword({email:em(u),password:pw});if(si.error)throw si.error;UID=si.data.user.id}
function showUpgrade(){if(G("upg"))return;var d=document.createElement("div");d.className="modal";d.id="upg";d.style.zIndex=70;d.innerHTML='<div class="box"><h2>Crea tu usuario y clave</h2><p class="empty">Así podrás entrar desde cualquier móvil sin perder tus datos.</p><label>Usuario<input id="u-u" autocapitalize="none"></label><label>Clave (mínimo 6 caracteres)<input id="u-p" type="password"></label><button class="abtn" style="margin:0;text-align:center" onclick="doUpgrade()">Guardar</button><div class="err" id="u-e"></div><button style="text-align:center" onclick="G(\'upg\').remove()">Más tarde</button></div>';document.body.appendChild(d)}
async function doUpgrade(){var u=G("u-u").value,p=G("u-p").value,e=G("u-e");if(!okUser(u)){e.textContent="Elige un usuario de al menos 3 letras o números.";return}if(p.length<6){e.textContent="La clave debe tener al menos 6 caracteres.";return}e.textContent="Guardando…";
var r=await SB.rpc("link_credentials",{p_user:un(u),p_pass:p});if(r.error){e.textContent=/ya existe/i.test(r.error.message)?"Ese usuario ya existe. Elige otro.":r.error.message;return}
var si=await SB.auth.signInWithPassword({email:em(u),password:p});if(si.error){e.textContent="Usuario creado, pero no se pudo iniciar sesión: "+si.error.message;return}
G("upg").remove();alert("Listo. Tu usuario es: "+un(u))}

async function admDraw(){var el=G("adm");el.innerHTML='<div class="panel"><p class="empty">Cargando…</p></div>';await loadM();var m=nextM(),a=await SB.from("profiles").select("*").order("number"),r=m?await SB.from("rsvps").select("user_id,going").eq("match_id",m.id):{data:[]};

h+='</div><div class="panel"><h2>Crear jugador</h2><p class="empty">Le pones usuario y una clave provisional, y se las das. Podrá cambiar la clave y subir su foto desde Mi perfil.</p><label>Usuario<input id="ad-u" autocapitalize="none"></label><label>Clave provisional (mínimo 6)<input id="ad-p"></label><label>Código del equipo<input id="ad-c" type="password"></label><label>Nombre<input id="ad-n"></label><label>Dorsal<input id="ad-d" type="number" inputmode="numeric"></label><label>Posición<select id="ad-s"><option>Base</option><option>Escolta</option><option>Alero</option><option>Ala-pívot</option><option>Pívot</option></select></label><label>Altura (cm)<input id="ad-h" type="number" inputmode="numeric"></label><label>Fecha de nacimiento<input id="ad-b" type="date"></label><label>Mote<input id="ad-k"></label><button class="save" onclick="admCreate()">Crear jugador</button><div class="err" id="ad-e"></div></div><div class="panel"><h2>Temporada</h2><p class="empty">Finalizar temporada: próximamente.</p></div>';
el.innerHTML=h}
async function admCall(fn,args){var r=await SB.rpc(fn,args);if(r.error){alert(r.error.message);return false}admDraw();return true}
function admRsvp(m,p,v){admCall("admin_set_rsvp",{p_match:m,p_player:p,p_going:v})}
function admActive(p,v){admCall("admin_set_active",{p_player:p,p_active:v})}
function admPass(p,n){var u=prompt("Usuario para "+n+" (letras, números, punto o guion):");if(!u)return;if(!okUser(u)){alert("Usuario no válido (mínimo 3 letras o números).");return}var k=prompt("Clave para "+n+" (mínimo 6 caracteres):");if(!k)return;if(k.length<6){alert("La clave debe tener al menos 6 caracteres.");return}admCall("admin_set_login",{p_player:p,p_user:un(u),p_pass:k}).then(function(ok){if(ok)alert("Listo. Usuario: "+un(u))})}
function admTransfer(p,n){if(confirm("¿Pasar el cargo de administrador a "+n+"? Tú dejarás de serlo."))admCall("admin_transfer",{p_new:p}).then(function(ok){if(ok)loadMe()})}
