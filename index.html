<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CB Entrevías · Partido en directo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#04080b;--panel:#0b151a;--line:#1b3944;--club:#3a9bb5;--text:#f4fbff;--mute:#7fa3af;--warn:#ffb020;--bad:#ff4d5e;--riv:#e5484d;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.4 Barlow,system-ui,sans-serif;max-width:560px;margin-inline:auto;padding:10px 12px 40px}
h1,h2,.num,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:linear-gradient(180deg,#0f2a33,var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px}
.team{text-align:center}.team .name{font:700 15px "Barlow Condensed",sans-serif;color:var(--mute);display:flex;gap:6px;align-items:center;justify-content:center}
.team .big{font-size:64px;font-weight:800;line-height:1}
.club .big{color:#fff;text-shadow:0 0 24px var(--club)}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:10px}.hd img{width:64px;height:64px}.hd h1{font-size:30px;font-weight:800;line-height:1}.hd p{margin:2px 0 0;color:var(--mute);font-size:13px}
body::before{content:"";position:fixed;inset:0;background:var(--logo) center 55%/min(90vw,520px) no-repeat;opacity:.05;pointer-events:none;z-index:-1}
.mid{text-align:center}.mid .q{font:700 16px "Barlow Condensed",sans-serif;color:var(--mute)}
.mid .clock{font:800 40px "Barlow Condensed",sans-serif;letter-spacing:1px}
.ctl{display:flex;gap:6px;justify-content:center;margin-top:4px}
.ctl button{background:var(--line);padding:7px 12px;border-radius:8px;font-weight:600}
.ctl .go{background:var(--club);color:#031116}
.fouls{font-size:13px;color:var(--mute)}.fouls b{color:var(--text)}.bonus{color:var(--warn);font-weight:700}
.sw{display:inline-flex;gap:5px;margin-top:6px}.sw i{width:18px;height:18px;border-radius:50%;border:2px solid transparent;display:block;cursor:pointer}.sw i.on{border-color:#fff}
.alert{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn);color:#1a1200;font-weight:700;display:none}
.alert.out{background:var(--bad);color:#fff}.alert.show{display:block}
.court{position:relative;margin-top:10px;aspect-ratio:100/92;border-radius:14px;background:#071014;border:1px solid var(--line);overflow:hidden}
.court svg{position:absolute;inset:0;width:100%;height:100%}
.tok{position:absolute;transform:translate(-50%,-50%);width:74px;text-align:center;background:none;padding:0}
.tok .c{width:56px;height:56px;margin:auto;border-radius:50%;background:var(--club);display:grid;place-items:center;color:#031116;font:800 26px "Barlow Condensed",sans-serif;border:3px solid #071014;box-shadow:0 0 0 2px var(--club)}
.tok.sel .c{box-shadow:0 0 0 4px #fff}.tok.f4 .c{box-shadow:0 0 0 3px var(--warn)}.tok.sel.f4 .c{box-shadow:0 0 0 4px #fff}
.tok .n{display:block;font-size:12px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok .pf{font-size:11px;color:var(--warn)}
.tok.empty .c{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--mute)}
.panel{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.panel h2{font-size:20px;margin-bottom:8px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts button{background:#12303a;min-height:54px;border-radius:10px;font:700 20px "Barlow Condensed",sans-serif}
.acts .pt{background:var(--club);color:#031116}.acts .bad{background:#2a1a22}.acts .out{background:#4a2230}
.line{display:flex;gap:12px;color:var(--mute);font-size:13px;margin-bottom:8px;flex-wrap:wrap}.line b{color:var(--text);font-size:15px}
.bench{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bench button{background:#0f232b;border-radius:10px;padding:6px 2px;font-size:12px;min-height:58px}
.bench .num{display:block;font-size:22px;font-weight:800}
.bench button.off{opacity:.35}
.riv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.riv button{background:#12303a;min-height:50px;border-radius:10px;font:700 20px "Barlow Condensed",sans-serif}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{background:var(--line);padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:380px}
th,td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}td:nth-child(2),th:nth-child(2){text-align:left}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}.tabs button{background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:10px;font:700 18px "Barlow Condensed",sans-serif;color:var(--mute)}.tabs button.on{background:var(--club);color:#031116;border-color:var(--club)}
label{display:block;margin-bottom:12px;color:var(--mute);font-size:13px}label input{display:block;width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#071014;color:var(--text);font:inherit;font-size:16px}
.save{width:100%;background:var(--club);color:#031116;padding:14px;border-radius:10px;font:800 20px "Barlow Condensed",sans-serif}.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.m{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.m.past{opacity:.45}.m b{font:700 22px "Barlow Condensed",sans-serif}.m small{display:block;color:var(--mute);text-transform:capitalize}.empty{color:var(--mute)}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px}#gate[hidden]{display:none}
#gate .box{max-width:520px;margin:0 auto}#gate img{width:96px;height:96px;display:block;margin:0 auto 6px}#gate h1{text-align:center;font-size:30px;font-weight:800}#gate .sub{text-align:center;color:var(--mute);margin:2px 0 14px}
label select{display:block;width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#071014;color:var(--text);font:inherit;font-size:16px}
.av{display:inline-block;width:22px;height:22px;border-radius:50%;background:#12303a center/cover;vertical-align:middle;margin-right:6px}
.tabs{grid-template-columns:repeat(3,1fr)}.tok{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;max-width:420px;max-height:80vh;overflow:auto}.modal h2{font-size:22px;margin-bottom:6px}.modal button{width:100%;margin-top:6px;padding:13px;border-radius:10px;background:#12303a;text-align:left;font-weight:600}
.tabs{grid-template-columns:repeat(4,1fr)}.tabs button{font-size:14px;padding:10px 2px}
.pf{width:120px;height:120px;border-radius:50%;background:#12303a center/cover;margin:0 auto 8px;display:grid;place-items:center;font:800 40px "Barlow Condensed",sans-serif;color:var(--mute)}.pf.s{width:46px;height:46px;margin:0;font-size:20px;flex:none}
.pl{display:flex;gap:10px;align-items:center;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;text-align:left}.pl small{display:block;color:var(--mute)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.kv span:first-child{color:var(--mute)}
#app.ro .acts,#app.ro .bench,#app.ro .riv,#app.ro .ctl,#app.ro .tok,#app.ro .sw,#app.ro .mini{pointer-events:none}
.abtn{background:var(--club);color:#031116;padding:8px 12px;border-radius:8px;font-weight:700;margin-left:6px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>

<body>
<div class="hd"><img id="hl" alt="Escudo del CB Entrevías"><div><h1>CB ENTREVÍAS</h1><p>Partido en directo</p></div><button id="me" class="mini" style="margin-left:auto" onclick="editMe()">Mi perfil</button></div>
<div class="tabs"><button id="t-live" class="on" onclick="tab('live')">Directo</button><button id="t-cal" onclick="tab('cal')">Calendario</button><button id="t-conv" onclick="tab('conv')">Convocatoria</button><button id="t-pl" onclick="tab('pl')">Jugadores</button></div>
<div id="gate"><div class="box"><img id="g-logo" alt="Escudo del CB Entrevías"><h1 id="g-t">Bienvenido</h1><p class="sub" id="g-s">Introduce el código del equipo y crea tu perfil.</p>
<div class="panel"><label id="g-cw">Código del equipo<input id="g-code" type="password" autocomplete="off"></label>
<label>Nombre<input id="g-name" maxlength="40"></label><label>Dorsal<input id="g-num" type="number" min="0" max="99" inputmode="numeric"></label>
<label>Posición preferida<select id="g-pos"><option>Base</option><option>Escolta</option><option>Alero</option><option>Ala-pívot</option><option>Pívot</option></select></label>
<label>Altura (cm)<input id="g-h" type="number" inputmode="numeric"></label>
<label>Fecha de nacimiento<input id="g-b" type="date"></label><label>Mote<input id="g-nick" maxlength="30"></label>
<label>Foto<input id="g-photo" type="file" accept="image/*"></label>
<button class="save" id="g-go" onclick="saveMe()">Entrar</button><div class="err" id="g-e"></div><button class="mini" id="g-x" hidden onclick="closeGate()" style="margin-top:8px">Cancelar</button></div></div></div>
<div id="app"></div><div id="cal" hidden></div><div id="conv" hidden></div><div id="pl" hidden></div>

else{h='<div class="panel"><h2>Jugadores ('+PL.length+')</h2></div>';PL.forEach(function(p){h+='<button class="pl" onclick="plDraw(\''+p.id+'\')">'+pav(p,1)+'<span><b>'+esc(p.name)+'</b>'+(p.nickname?' «'+esc(p.nickname)+'»':'')+'<small>'+esc(p.position||"")+' · '+pst(p.id)+'</small></span></button>'})}
el.innerHTML=h}

var ROLE="none",LV=null,PN=null,SVt=null;
function schedSave(){if(ROLE!=="admin"||SVt)return;SVt=setTimeout(function(){SVt=null;doSave()},1500)}
async function doSave(){if(ROLE!=="admin"||!S.mid)return;var st=JSON.parse(JSON.stringify(S,function(k,v){return(k==="undo"||k==="menu"||k==="sel"||k==="msg")?undefined:v}));var r=await SB.rpc("live_save",{p_match:S.mid,p_state:st});if(r.error&&/Admin/i.test(r.error.message)){ROLE="viewer"}}
function applyState(st){S=Object.assign({},st,{sel:S.sel,menu:null,undo:[],msg:S.msg,lvl:S.lvl})}
async function poll(){if(!S.mid||G("app").hidden)return;
try{if(!PN){var pr=await SB.from("profiles").select("id,name,nickname");PN={};(pr.data||[]).forEach(function(x){PN[x.id]=x.nickname||x.name})}
var r=await SB.from("live_matches").select("*").eq("match_id",S.mid).maybeSingle();if(r.error)return;var L=r.data;LV=L;
ROLE=!L||!L.admin_id?"none":(L.admin_id===UID?"admin":"viewer");
if(ROLE!=="admin"&&L&&L.state&&L.state.p)applyState(L.state);
if(L&&L.claim_by===UID&&Date.now()-Date.parse(L.claim_at)>10500)await SB.rpc("live_resolve",{p_match:S.mid})}catch(e){}
draw()}
function adminBar(){var L=LV,nm=function(u){return esc((PN&&PN[u])||"Un jugador")},left=function(){return Math.max(0,10-Math.floor((Date.now()-Date.parse(L.claim_at))/1000))},b='<div class="panel" style="padding:8px 10px;margin:0 0 10px">';
if(ROLE==="admin"){if(L&&L.claim_by){b+='<b>'+nm(L.claim_by)+' pide el control</b> · '+left()+' s<div class="acts" style="grid-template-columns:1fr 1fr;margin-top:6px"><button class="pt" onclick="ans(true)">Aceptar</button><button class="out" onclick="ans(false)">No</button></div>'}else b+='Eres el <b>Admin</b> del partido.'}
else if(ROLE==="viewer"&&L){if(L.claim_by===UID)b+='Esperando respuesta del Admin… '+left()+' s';else b+='Siguiendo en directo · Admin: <b>'+nm(L.admin_id)+'</b><button class="abtn" onclick="claimCtl()">Pedir control</button>'}
else b+='Nadie controla el partido. <button class="abtn" onclick="takeAdmin()">Ser Admin</button>';
return b+'</div>'}
async function takeAdmin(){var r=await SB.rpc("live_take",{p_match:S.mid});if(r.error){say(r.error.message,1);draw();return}ROLE="admin";await doSave();poll()}
async function claimCtl(){await SB.rpc("live_claim",{p_match:S.mid});poll()}
async function ans(v){if(v)await doSave();await SB.rpc("live_answer",{p_match:S.mid,p_accept:v});poll()}
setInterval(poll,1500);
boot();
</script>
